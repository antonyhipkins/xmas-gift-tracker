<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultimate Christmas Gift Tracker</title>
<meta name="theme-color" content="#7a0f2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xmas Gifts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
:root{--ruby:#b3123a;--ruby-d:#7a0f2e;--em:#0f6b4b;--em-d:#0b4a35;--gold:#f6c945;--gold-d:#c9971a;--ink:#2b1620;--muted:#7b6470;--card:rgba(255,252,247,.96);--line:#eadfd6}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(155deg,#5b0a25 0%,#8a1236 38%,#0d5a41 100%) fixed;min-height:100vh;padding-bottom:96px}
#sparkle{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
.hero{text-align:center;padding:20px 8px 10px;color:#fff}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.7rem,6.5vw,2.8rem);margin:.1em 0;letter-spacing:.5px;color:#f6c945;background:linear-gradient(90deg,#fff3c4,#f6c945,#ffffff,#f6c945,#fff3c4);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.hero p{margin:0;opacity:.92}
.card{background:var(--card);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 24px rgba(0,0,0,.28);border:1px solid rgba(246,201,69,.55)}
h2{font-family:Georgia,serif;margin:0 0 10px;font-size:1.3rem;color:var(--ruby-d)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:16px;padding:14px 10px;text-align:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.2)}
.tile b{display:block;font-size:1.55rem;line-height:1.15}
.tile small{opacity:.92;font-size:.78rem;letter-spacing:.4px;text-transform:uppercase}
.t1{background:linear-gradient(135deg,#c0163f,#7a0f2e)}
.t2{background:linear-gradient(135deg,#17805a,#0b4a35)}
.t3{background:linear-gradient(135deg,#e0a91c,#a87608)}
.t4{background:linear-gradient(135deg,#6b3fa0,#3d2270)}
.t4.over{background:linear-gradient(135deg,#e2312d,#8f0f14)}
.bar{height:12px;background:#f0e6dc;border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#17805a,#3cc48c)}
.bar.big{height:20px}
.bar .plan{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#f6c945,#f6c945 8px,#fbe08a 8px,#fbe08a 16px);opacity:.85}
.bar .spent{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#17805a,#3cc48c)}
.bar.over .plan{background:linear-gradient(90deg,#e2312d,#ff6b5e)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .l1:before{background:#3cc48c}.legend .l2:before{background:#f6c945}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:6px 12px;border-radius:99px;font-size:.88rem;font-weight:bold;background:#f5ece3}
.pill b{margin-left:4px}
.st-idea{background:#efe7ff;color:#4b2a86}.st-ordered{background:#dff0ff;color:#0d4f8a}.st-bought{background:#fff0c9;color:#7a5200}.st-wrapped{background:#ffdfe8;color:#a10f3f}.st-given{background:#d9f5e6;color:#0b6a43}
.muted{color:var(--muted)}
.tip{background:linear-gradient(135deg,#fff8dc,#ffeaa8);border-radius:14px;padding:12px 14px;color:#5e4200;font-weight:bold}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:bold;cursor:pointer;color:#fff;background:linear-gradient(135deg,#c0163f,#7a0f2e);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(135deg,#ffe07a,#e0a91c);color:#4a3000}
.btn.green{background:linear-gradient(135deg,#17805a,#0b4a35)}
.btn.ghost{background:#fff;color:var(--ruby-d);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid #dccfc4;border-radius:10px;padding:9px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold-d)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:bold}
.addp{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px){.addp{grid-template-columns:1.3fr 1fr .8fr auto;align-items:end}}
.person{padding:0;overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:bold;font-size:1.2rem;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.pinfo{flex:1;min-width:0}.pinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo small{color:var(--muted)}
.pmoney{text-align:right;font-size:.95rem}.pmoney small{display:block;color:var(--muted)}
.pmoney.over b{color:#c4161c}
.chev{transition:transform .2s;color:var(--muted)}.open .chev{transform:rotate(180deg)}
.pbar{padding:0 14px 12px}
.pbody{padding:0 14px 14px;border-top:1px dashed var(--line)}
.pfields{display:grid;grid-template-columns:1fr 1fr 110px;gap:8px;margin:12px 0}
.gift{display:grid;grid-template-columns:1fr 92px;gap:6px;padding:10px;background:#fbf6f0;border-radius:12px;margin:8px 0;border:1px solid var(--line)}
.gift .gi{grid-column:1/2}.gift .gp{grid-column:2/3}
.gift .gs{grid-column:1/2;font-weight:bold;border:0}
.gift .gst{grid-column:1/2}
.gift .x{grid-column:2/3;grid-row:2/4;align-self:stretch}
@media(min-width:720px){.gift{grid-template-columns:1.4fr 92px 120px 1fr 36px;align-items:center}.gift .gi,.gift .gp,.gift .gs,.gift .gst,.gift .x{grid-column:auto;grid-row:auto}}
.x{border:0;background:#f3dede;color:#a10f3f;border-radius:10px;cursor:pointer;font-weight:bold;min-height:36px}
.extra{display:grid;grid-template-columns:32px 1fr 100px 36px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.extra .cat{grid-column:2/3}
.extra .e-cost{grid-column:3/4}
.extra input[type=checkbox]{width:22px;height:22px;accent-color:#17805a}
@media(min-width:720px){.extra{grid-template-columns:32px 1.4fr 1fr 100px 36px}.extra .cat{grid-column:auto}.extra .e-cost{grid-column:auto}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(60,8,24,.92);backdrop-filter:blur(8px);border-top:1px solid rgba(246,201,69,.6)}
nav button{flex:1;max-width:190px;border:0;background:transparent;color:#f6dfe6;font:inherit;font-size:.78rem;padding:6px 4px;border-radius:12px;cursor:pointer}
nav button span{display:block;font-size:1.35rem}
nav button.on{background:linear-gradient(135deg,#ffe07a,#e0a91c);color:#4a3000;font-weight:bold}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0b4a35;color:#fff;padding:10px 16px;border-radius:99px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.help li{margin:6px 0}
.foot{text-align:center;color:rgba(255,255,255,.75);font-size:.8rem;padding:6px 0 0}
.bellbtn{margin-top:12px;border:1px solid rgba(246,201,69,.8);background:rgba(255,255,255,.14);color:#fff3c4;font:inherit;font-weight:bold;padding:9px 18px;border-radius:99px;cursor:pointer;backdrop-filter:blur(4px)}
.bellbtn.on{background:linear-gradient(135deg,#ffe07a,#e0a91c);color:#4a3000;border-color:#ffe07a}
.bellbtn:active{transform:scale(.97)}
@media print{
 body{background:#fff;padding:0}#sparkle,nav,.btn,.x,#toast,.bellbtn{display:none!important}
 .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.hero{color:#000}.hero h1{-webkit-text-fill-color:#7a0f2e}
}
</style>
</head>
<body>
<canvas id="sparkle" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="hero">
    <div style="font-size:1.6rem">🎄 ✨ 🎁 ✨ 🎄</div>
    <h1>Ultimate Christmas Gift Tracker</h1>
    <p>Who, what, how much, and is it wrapped yet?</p>
    <button class="bellbtn" data-act="bells" aria-pressed="false" type="button">🔕 Sleigh bells off</button>
  </header>
  <main id="main"></main>
  <div class="foot">Your lists are saved on this device, in this browser. Use Export on the Settings tab to keep a backup.</div>
</div>
<nav id="nav">
  <button data-act="tab" data-t="dash"><span>🎅</span>Overview</button>
  <button data-act="tab" data-t="people"><span>🎁</span>Gifts</button>
  <button data-act="tab" data-t="extras"><span>🍽️</span>Extras</button>
  <button data-act="tab" data-t="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
var KEY="xmasGiftTracker.v1";
var STATUSES=[["idea","Idea","💡"],["ordered","Ordered","📦"],["bought","Bought","🛍️"],["wrapped","Wrapped","🎀"],["given","Given","🎁"]];
var EXTRA_CATS=["Food and drink","Cards and postage","Wrapping and tags","Decorations","Parties and events","Travel","Charity","Other"];
var PALETTE=["#b3123a","#0f6b4b","#c9971a","#6b3fa0","#1f7aa8","#d1571f","#8a2f6d","#3f7d20"];
var ui={tab:"dash",open:{},focus:null};

function uid(){return Math.random().toString(36).slice(2,9)}
function defaults(){
  var starters=[["Christmas dinner","Food and drink"],["Drinks and treats","Food and drink"],["Christmas cards","Cards and postage"],["Stamps and postage","Cards and postage"],["Wrapping paper, ribbon and tags","Wrapping and tags"],["Tree and decorations","Decorations"],["Advent calendar","Other"],["Charity donation","Charity"]];
  return {settings:{currency:"£",budget:500},people:[],extras:starters.map(function(s){return {id:uid(),item:s[0],cat:s[1],cost:0,paid:false}})};
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw);var d=defaults();
      return {settings:Object.assign(d.settings,s.settings||{}),people:Array.isArray(s.people)?s.people:[],extras:Array.isArray(s.extras)?s.extras:d.extras};}
  }catch(e){}
  return defaults();
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast("Could not save in this browser. Please use Export to keep a copy.")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)&&n>0?Math.round(n*100)/100:0}
function money(n){var c=state.settings.currency;return c+(n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},2800)}


/*BELLS_START*/
var Bells=(function(){
  var ctx=null,master=null,timer=null,on=false,noise=null,evs=null,idx=0,loopStart=0;
  var SPB=60/112,LEN=36;
  var F={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99};
  var MEL=[["E",1],["E",1],["E",2],["E",1],["E",1],["E",2],["E",1],["G",1],["C",1.5],["D",.5],["E",4],
           ["F",1],["F",1],["F",1.5],["F",.5],["F",1],["E",1],["E",1],["E",.5],["E",.5],["E",1],["D",1],["D",1],["E",1],["D",2],["G",2]];
  function build(){
    var list=[],t=0,i;
    for(i=0;i<MEL.length;i++){list.push({t:t,k:"n",f:F[MEL[i][0]]});t+=MEL[i][1]}
    for(i=0;i<LEN*2;i++){list.push({t:i/2,k:"j",v:(i%2===0)?(i%4===0?1:.75):.45})}
    list.sort(function(a,b){return a.t-b.t});
    return list;
  }
  function tone(f,t,vol){
    [[1,1,1.3],[2.76,.32,.7],[5.4,.1,.35]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f*p[0];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(vol*p[1],t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+p[2]+.05);
    });
  }
  function jingle(t,vol){
    var s=ctx.createBufferSource();s.buffer=noise;
    var hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=5200;
    var bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=7600;bp.Q.value=.9;
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol*.5,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    s.connect(hp);hp.connect(bp);bp.connect(g);g.connect(master);
    s.start(t,Math.random()*.8,.2);
    [3900,5100,6400].forEach(function(fr){
      var o=ctx.createOscillator(),og=ctx.createGain();
      o.type="sine";o.frequency.value=fr*(0.99+Math.random()*.02);
      og.gain.setValueAtTime(0.0001,t);
      og.gain.linearRampToValueAtTime(vol*.035,t+.003);
      og.gain.exponentialRampToValueAtTime(.0001,t+.28);
      o.connect(og);og.connect(master);o.start(t);o.stop(t+.3);
    });
  }
  function tick(){
    if(!on||!ctx)return;
    var horizon=ctx.currentTime+.4;
    while(true){
      var e=evs[idx],when=loopStart+e.t*SPB;
      if(when>horizon)break;
      if(when<ctx.currentTime-.05){when=ctx.currentTime+.02}
      if(e.k==="n")tone(e.f,when,.22);else jingle(when,e.v);
      idx++;
      if(idx>=evs.length){idx=0;loopStart+=LEN*SPB}
    }
  }
  function paint(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="bells"]'),function(b){
      b.textContent=on?"🔔 Sleigh bells on":"🔕 Sleigh bells off";
      b.setAttribute("aria-pressed",on?"true":"false");
      b.classList.toggle("on",on);
    });
  }
  function start(){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){toast("Sound is not supported on this device.");return}
    try{
      if(!ctx){
        ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
        var len=Math.floor(ctx.sampleRate*1.5),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
        for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
        noise=buf;evs=build();
      }
      ctx.resume();
      on=true;idx=0;loopStart=ctx.currentTime+.12;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
      master.gain.linearRampToValueAtTime(.55,ctx.currentTime+.4);
      clearInterval(timer);timer=setInterval(tick,90);tick();
    }catch(err){on=false;toast("Sound would not start on this device.")}
    paint();
  }
  function stop(){
    on=false;clearInterval(timer);
    if(ctx){
      try{master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.25)}catch(e){}
      var c=ctx;setTimeout(function(){if(!on){try{c.suspend()}catch(e){}}},400);
    }
    paint();
  }
  document.addEventListener("visibilitychange",function(){
    if(!ctx||!on)return;
    try{if(document.hidden){ctx.suspend()}else{ctx.resume();loopStart=ctx.currentTime+.1;idx=0}}catch(e){}
  });
  return {toggle:function(){if(on)stop();else start()},paint:paint,isOn:function(){return on}};
})();
/*BELLS_END*/

function pPlanned(p){return p.gifts.reduce(function(a,g){return a+(g.price||0)},0)}
function pSpent(p){return p.gifts.reduce(function(a,g){return a+(g.status!=="idea"?(g.price||0):0)},0)}
function totals(){
  var gp=0,gs=0,ep=0,es=0,counts={idea:0,ordered:0,bought:0,wrapped:0,given:0},n=0;
  state.people.forEach(function(p){gp+=pPlanned(p);gs+=pSpent(p);p.gifts.forEach(function(g){counts[g.status]=(counts[g.status]||0)+1;n++})});
  state.extras.forEach(function(x){ep+=x.cost||0;if(x.paid)es+=x.cost||0});
  var planned=gp+ep,spent=gs+es,b=state.settings.budget||0;
  return {gp:gp,gs:gs,ep:ep,es:es,planned:planned,spent:spent,budget:b,left:b-planned,counts:counts,n:n};
}
function nextXmas(){
  var n=new Date(),y=n.getFullYear();
  var d=new Date(y,11,25,0,0,0);
  if(n>new Date(y,11,25,23,59,59))d=new Date(y+1,11,25,0,0,0);
  return d;
}
function daysLeft(){
  var n=new Date(),d=nextXmas();
  if(n.getMonth()===11&&n.getDate()===25)return 0;
  return Math.ceil((d-n)/86400000);
}
function countdownText(){var d=daysLeft();return d===0?"Merry Christmas! 🎄":d+(d===1?" sleep":" sleeps")}
function tipText(){
  var d=daysLeft(),t=totals();
  if(d===0)return "Merry Christmas! Put your feet up and enjoy it.";
  if(t.n===0)return "Start with the people. Add everyone you buy for, then drop in gift ideas as they come to you.";
  if(t.budget&&t.left<0)return "You are "+money(-t.left)+" over budget. Check the Gifts tab for anyone flagged red.";
  if(d>60)return "Plenty of time. Get the ideas down now and the prices can follow.";
  if(d>30)return "A good moment to start ordering. Sales and offers are around, so compare before you buy.";
  if(d>14)return "Order anything that needs delivering now, and post cards and parcels going overseas.";
  return "Final stretch. Tick off what is wrapped and see what is still an idea.";
}

function render(){
  var m=document.getElementById("main");
  m.innerHTML=ui.tab==="dash"?vDash():ui.tab==="people"?vPeople():ui.tab==="extras"?vExtras():vSettings();
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){b.classList.toggle("on",b.dataset.t===ui.tab)});
  if(ui.focus){var el=document.querySelector(ui.focus);if(el){el.focus()}ui.focus=null}
  Bells.paint();
}
function vDash(){
  var t=totals(),pct=t.budget?Math.min(100,t.planned/t.budget*100):0,sp=t.budget?Math.min(100,t.spent/t.budget*100):0;
  var over=t.budget&&t.left<0;
  var h='<div class="card"><div class="tiles">'+
   '<div class="tile t1"><b id="cd">'+countdownText()+'</b><small>until Christmas</small></div>'+
   '<div class="tile t2"><b>'+money(t.budget)+'</b><small>Budget</small></div>'+
   '<div class="tile t3"><b>'+money(t.spent)+'</b><small>Spent so far</small></div>'+
   '<div class="tile t4'+(over?" over":"")+'"><b>'+money(Math.abs(t.left))+'</b><small>'+(over?"Over budget":"Left to spend")+'</small></div></div></div>';
  h+='<div class="card"><h2>Budget</h2><div class="bar big'+(over?" over":"")+'"><div class="plan" style="width:'+pct+'%"></div><div class="spent" style="width:'+sp+'%"></div></div>'+
   '<div class="legend"><span class="l1">Spent: '+money(t.spent)+'</span><span class="l2">Planned in total: '+money(t.planned)+'</span></div>'+
   '<p class="muted" style="margin:10px 0 0">Gifts '+money(t.gp)+' &nbsp;|&nbsp; Extras '+money(t.ep)+'</p></div>';
  h+='<div class="card"><div class="tip">✨ '+esc(tipText())+'</div></div>';
  h+='<div class="card"><h2>Gift progress</h2><div class="pills">'+STATUSES.map(function(s){return '<span class="pill st-'+s[0]+'">'+s[2]+' '+s[1]+'<b>'+t.counts[s[0]]+'</b></span>'}).join("")+'</div></div>';
  h+='<div class="card"><h2>Who is sorted?</h2>';
  if(!state.people.length){h+='<div class="empty">No one added yet.<br><br><button class="btn gold" data-act="tab" data-t="people">Add your first person</button></div>'}
  else{
    h+=state.people.map(function(p){
      var total=p.gifts.length,done=p.gifts.filter(function(g){return g.status==="wrapped"||g.status==="given"}).length;
      var w=total?Math.round(done/total*100):0,ov=p.budget&&pPlanned(p)>p.budget;
      return '<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><b>'+esc(p.name||"Unnamed")+'</b><span class="muted">'+(total?done+" of "+total+" wrapped or given":"no gifts yet")+(ov?' <b style="color:#c4161c">over budget</b>':"")+'</span></div><div class="bar"><i style="width:'+w+'%"></i></div></div>';
    }).join("");
  }
  h+='</div>';
  return h;
}
function vPeople(){
  var h='<div class="card"><h2>Add someone</h2><form id="addP" class="addp">'+
   '<label class="f">Name<input name="name" placeholder="e.g. Mum" required maxlength="40"></label>'+
   '<label class="f">Who are they?<input name="rel" placeholder="e.g. Family, Friend, Colleague" maxlength="40"></label>'+
   '<label class="f">Budget<input name="bud" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></label>'+
   '<button class="btn gold" type="submit">Add ✨</button></form></div>';
  if(!state.people.length){return h+'<div class="card empty">Your list is empty. Add the first person above and the gift ideas can follow.</div>'}
  h+=state.people.map(personCard).join("");
  return h;
}
function personCard(p,i){
  var pl=pPlanned(p),ov=p.budget&&pl>p.budget,open=!!ui.open[p.id];
  var w=p.budget?Math.min(100,pl/p.budget*100):(pl?100:0);
  var col=PALETTE[i%PALETTE.length];
  var h='<section class="card person'+(open?" open":"")+'">'+
   '<div class="phead" data-act="toggle" data-p="'+p.id+'"><div class="avatar" style="background:'+col+'">'+esc((p.name||"?").trim().charAt(0).toUpperCase()||"?")+'</div>'+
   '<div class="pinfo"><b data-title="'+p.id+'">'+esc(p.name||"Unnamed")+'</b><small>'+esc(p.rel||"")+(p.gifts.length?(p.rel?" | ":"")+p.gifts.length+(p.gifts.length===1?" gift":" gifts"):"")+'</small></div>'+
   '<div class="pmoney'+(ov?" over":"")+'"><b>'+money(pl)+'</b><small>'+(p.budget?"of "+money(p.budget):"no budget set")+'</small></div><span class="chev">▾</span></div>'+
   '<div class="pbar"><div class="bar'+(ov?" over":"")+'"><div class="plan" style="width:'+w+'%"></div></div></div>';
  if(open){
    h+='<div class="pbody"><div class="pfields">'+
     '<label class="f">Name<input data-f="p.name" data-p="'+p.id+'" value="'+esc(p.name)+'" maxlength="40"></label>'+
     '<label class="f">Who are they?<input data-f="p.rel" data-p="'+p.id+'" value="'+esc(p.rel)+'" maxlength="40"></label>'+
     '<label class="f">Budget<input type="number" inputmode="decimal" min="0" step="0.01" data-f="p.bud" data-p="'+p.id+'" value="'+(p.budget||"")+'"></label></div>';
    if(!p.gifts.length)h+='<div class="empty" style="padding:12px">No gifts yet. Add the first idea below.</div>';
    h+=p.gifts.map(function(g){return giftRow(p,g)}).join("");
    h+='<div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn green" data-act="addGift" data-p="'+p.id+'">+ Add a gift</button><button class="btn ghost" data-act="delPerson" data-p="'+p.id+'">Remove '+esc(p.name||"person")+'</button></div></div>';
  }
  return h+'</section>';
}
function giftRow(p,g){
  return '<div class="gift">'+
   '<input class="gi" id="g'+g.id+'" data-f="g.item" data-p="'+p.id+'" data-g="'+g.id+'" placeholder="Gift idea" value="'+esc(g.item)+'" maxlength="80">'+
   '<input class="gp" type="number" inputmode="decimal" min="0" step="0.01" data-f="g.price" data-p="'+p.id+'" data-g="'+g.id+'" placeholder="Price" value="'+(g.price||"")+'">'+
   '<select class="gs st-'+g.status+'" data-f="g.status" data-p="'+p.id+'" data-g="'+g.id+'">'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(g.status===s[0]?" selected":"")+'>'+s[2]+' '+s[1]+'</option>'}).join("")+'</select>'+
   '<input class="gst" data-f="g.store" data-p="'+p.id+'" data-g="'+g.id+'" placeholder="Shop, link or note" value="'+esc(g.store)+'" maxlength="120">'+
   '<button class="x" title="Remove gift" data-act="delGift" data-p="'+p.id+'" data-g="'+g.id+'">✕</button></div>';
}
function vExtras(){
  var t=totals();
  var h='<div class="card"><h2>The rest of Christmas</h2><p class="muted" style="margin-top:0">Food, cards, wrapping and everything else that is not a present. Tick the box once it is paid for.</p>'+
   '<div class="pills"><span class="pill st-bought">Planned <b>'+money(t.ep)+'</b></span><span class="pill st-given">Paid <b>'+money(t.es)+'</b></span></div><div style="margin-top:8px">';
  h+=state.extras.map(function(x){
    return '<div class="extra"><input type="checkbox" title="Paid" data-f="e.paid" data-e="'+x.id+'"'+(x.paid?" checked":"")+'>'+
     '<input id="e'+x.id+'" data-f="e.item" data-e="'+x.id+'" value="'+esc(x.item)+'" placeholder="What is it?" maxlength="80">'+
     '<select class="cat" data-f="e.cat" data-e="'+x.id+'">'+EXTRA_CATS.map(function(c){return '<option'+(x.cat===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select>'+
     '<input class="e-cost" type="number" inputmode="decimal" min="0" step="0.01" data-f="e.cost" data-e="'+x.id+'" placeholder="Cost" value="'+(x.cost||"")+'">'+
     '<button class="x" title="Remove" data-act="delExtra" data-e="'+x.id+'">✕</button></div>';
  }).join("");
  h+='</div><div style="margin-top:12px"><button class="btn green" data-act="addExtra">+ Add an item</button></div></div>';
  return h;
}
function vSettings(){
  var s=state.settings;
  return '<div class="card"><h2>Your Christmas budget</h2><div class="row">'+
   '<label class="f">Total budget<input type="number" inputmode="decimal" min="0" step="1" data-f="s.budget" value="'+(s.budget||"")+'"></label>'+
   '<label class="f">Currency<select data-f="s.currency">'+["£","$","€"].map(function(c){return '<option'+(s.currency===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select></label></div>'+
   '<p class="muted">This is the whole lot: presents, food, cards and extras.</p></div>'+
   '<div class="card"><h2>Backup and print</h2><p class="muted" style="margin-top:0">Everything is stored in this browser on this device. Clearing your browser data would wipe it, so export a backup now and then. The backup file can be imported on another device.</p>'+
   '<div class="row"><button class="btn green" data-act="export">Export backup</button><button class="btn gold" data-act="import">Import backup</button><button class="btn ghost" data-act="print">Print my lists</button></div></div>'+
   '<div class="card"><h2>Sleigh bells</h2><p class="muted" style="margin-top:0">A gentle loop of sleigh bells and a bell-tone Jingle Bells. It starts off each time you open the app.</p><button class="btn gold" data-act="bells" type="button">🔕 Sleigh bells off</button><p class="muted" style="margin:10px 0 0;font-size:.85rem">No sound on an iPhone? Check the silent switch on the side and the volume.</p></div>'+
   '<div class="card help"><h2>Put it on your phone</h2><p style="margin:0 0 6px"><b>iPhone:</b> open this page in Safari, tap the Share button, then <b>Add to Home Screen</b>.</p><p style="margin:0"><b>Android:</b> open this page in Chrome, tap the menu (three dots), then <b>Install app</b> or <b>Add to Home screen</b>.</p><p class="muted" style="margin:8px 0 0">Once it is on your Home Screen it opens full screen, works offline and keeps your lists safe.</p></div>'+
   '<div class="card help"><h2>Quick guide</h2><ol style="padding-left:20px;margin:0"><li>Set your total budget above.</li><li>On the <b>Gifts</b> tab add each person, then tap their name to open them and add gift ideas.</li><li>Change a gift from Idea to Ordered, Bought, Wrapped and Given as you go. Only gifts past the Idea stage count as spent.</li><li>Use <b>Extras</b> for food, cards and decorations.</li><li>The <b>Overview</b> shows the countdown, what is left and who is still not sorted.</li></ol></div>'+
   '<div class="card"><h2>Start again</h2><p class="muted" style="margin-top:0">Clears every person, gift and extra. Export a backup first if you want to keep this year.</p><button class="btn ghost" data-act="reset">Clear everything</button></div>';
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,p=b.dataset.p?state.people.filter(function(x){return x.id===b.dataset.p})[0]:null;
  if(a==="bells"){Bells.toggle();return}
  if(a==="tab"){ui.tab=b.dataset.t;render();window.scrollTo(0,0);return}
  if(a==="toggle"){ui.open[b.dataset.p]=!ui.open[b.dataset.p];render();return}
  if(a==="addGift"&&p){var g={id:uid(),item:"",price:0,status:"idea",store:""};p.gifts.push(g);save();ui.focus="#g"+g.id;render();return}
  if(a==="delGift"&&p){p.gifts=p.gifts.filter(function(x){return x.id!==b.dataset.g});save();render();return}
  if(a==="delPerson"&&p){if(confirm("Remove "+(p.name||"this person")+" and all their gifts?")){state.people=state.people.filter(function(x){return x!==p});save();render()}return}
  if(a==="addExtra"){var x={id:uid(),item:"",cat:"Other",cost:0,paid:false};state.extras.push(x);save();ui.focus="#e"+x.id;render();return}
  if(a==="delExtra"){state.extras=state.extras.filter(function(x){return x.id!==b.dataset.e});save();render();return}
  if(a==="export"){doExport();return}
  if(a==="import"){document.getElementById("importFile").click();return}
  if(a==="print"){state.people.forEach(function(q){ui.open[q.id]=true});ui.tab="people";render();setTimeout(function(){window.print()},150);return}
  if(a==="reset"){if(confirm("Clear everything? This cannot be undone.")){state=defaults();ui.open={};save();render();toast("All cleared. Fresh start.")}return}
});
document.addEventListener("submit",function(e){
  if(e.target.id!=="addP")return;e.preventDefault();
  var f=e.target,name=f.elements.name.value.trim();if(!name)return;
  var p={id:uid(),name:name,rel:f.elements.rel.value.trim(),budget:num(f.elements.bud.value),gifts:[]};
  var g={id:uid(),item:"",price:0,status:"idea",store:""};p.gifts.push(g);
  state.people.push(p);ui.open[p.id]=true;save();
  ui.focus="#g"+g.id;render();toast("Added "+name+" 🎁");
});
document.addEventListener("change",function(e){
  var t=e.target,f=t.dataset.f;if(!f)return;
  var p=t.dataset.p?state.people.filter(function(x){return x.id===t.dataset.p})[0]:null;
  var g=p&&t.dataset.g?p.gifts.filter(function(x){return x.id===t.dataset.g})[0]:null;
  var x=t.dataset.e?state.extras.filter(function(y){return y.id===t.dataset.e})[0]:null;
  if(f==="s.budget"){state.settings.budget=num(t.value);save();toast("Budget saved");return}
  if(f==="s.currency"){state.settings.currency=t.value;save();render();return}
  if(f==="p.name"&&p){p.name=t.value.trim();save();var h=document.querySelector('[data-title="'+p.id+'"]');if(h)h.textContent=p.name||"Unnamed";return}
  if(f==="p.rel"&&p){p.rel=t.value.trim();save();return}
  if(f==="p.bud"&&p){p.budget=num(t.value);save();render();return}
  if(f==="g.item"&&g){g.item=t.value.trim();save();return}
  if(f==="g.store"&&g){g.store=t.value.trim();save();return}
  if(f==="g.price"&&g){g.price=num(t.value);save();render();return}
  if(f==="g.status"&&g){g.status=t.value;save();render();if(t.value==="given")toast("🎁 Given! One more sorted.");return}
  if(f==="e.item"&&x){x.item=t.value.trim();save();return}
  if(f==="e.cat"&&x){x.cat=t.value;save();return}
  if(f==="e.cost"&&x){x.cost=num(t.value);save();render();return}
  if(f==="e.paid"&&x){x.paid=t.checked;save();render();return}
});
document.getElementById("importFile").addEventListener("change",function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.people))throw new Error("bad");
      if(!confirm("Replace what is on this device with the backup?"))return;
      var base=defaults();
      state={settings:Object.assign(base.settings,d.settings||{}),people:d.people.map(function(p){p.gifts=Array.isArray(p.gifts)?p.gifts:[];return p}),extras:Array.isArray(d.extras)?d.extras:base.extras};
      save();render();toast("Backup restored");
    }catch(err){toast("That file does not look like a Gift Tracker backup.")}
  };
  r.readAsText(file);e.target.value="";
});
function doExport(){
  try{
    var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="christmas-gift-tracker-backup.json";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    toast("Backup downloaded");
  }catch(err){toast("Export did not work in this browser.")}
}

setInterval(function(){var c=document.getElementById("cd");if(c)c.textContent=countdownText()},60000);

(function(){
  var c=document.getElementById("sparkle");
  if(!c||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  var x=c.getContext("2d"),w=0,h=0,items=[];
  function mk(rand){return {x:Math.random()*w,y:rand?Math.random()*h:-12,r:Math.random()*2.4+.8,s:Math.random()*.55+.25,d:Math.random()*6.28,t:Math.random()*6.28,star:Math.random()<.28}}
  function size(){w=c.width=innerWidth;h=c.height=innerHeight;var n=Math.min(85,Math.floor(w*h/17000));items=[];for(var i=0;i<n;i++)items.push(mk(true))}
  function frame(){
    x.clearRect(0,0,w,h);
    for(var i=0;i<items.length;i++){
      var f=items[i];f.y+=f.s;f.d+=.012;f.x+=Math.sin(f.d)*.35;f.t+=.06;
      if(f.y>h+12){items[i]=f=mk(false)}
      if(f.star){
        var a=.35+.65*Math.abs(Math.sin(f.t)),s=f.r*2.6;
        x.save();x.translate(f.x,f.y);x.globalAlpha=a;x.fillStyle="#ffe07a";
        x.beginPath();x.moveTo(0,-s);x.lineTo(s*.28,-s*.28);x.lineTo(s,0);x.lineTo(s*.28,s*.28);x.lineTo(0,s);x.lineTo(-s*.28,s*.28);x.lineTo(-s,0);x.lineTo(-s*.28,-s*.28);x.closePath();x.fill();x.restore();
      }else{
        x.globalAlpha=.85;x.fillStyle="#fff";x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill();
      }
    }
    x.globalAlpha=1;requestAnimationFrame(frame);
  }
  addEventListener("resize",size);size();requestAnimationFrame(frame);
})();

render();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
})();
</script>
